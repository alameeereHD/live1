<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ثمانية</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
#app{display:flex;flex-direction:column;width:100%;height:100%}
#player-wrap{flex:1;position:relative;user-select:none;overflow:hidden;background:#000}
video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
#brand-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:50;pointer-events:none;transition:opacity .5s}
#brand-overlay span{color:#fff;font-size:32px;font-weight:900;letter-spacing:4px;animation:wave 2s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(0);text-shadow:0 0 10px rgba(0,200,255,.4)}25%{transform:translateY(-8px);text-shadow:0 0 24px rgba(0,200,255,.9)}75%{transform:translateY(6px);text-shadow:0 0 18px rgba(0,200,255,.6)}}
#player-wrap.playing #brand-overlay{opacity:0;z-index:-1}
#loader{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:10;font-size:14px;color:#fff}
#ch-title{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);padding:5px 16px;border-radius:20px;font-size:13px;font-weight:700;color:#fff;z-index:6;display:none}
#controls-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.92));padding:28px 8px 10px;display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100}
#player-wrap.show-ctrl #controls-overlay{opacity:1;pointer-events:auto}
.cb{background:rgba(255,255,255,.12);border:none;color:#fff;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;backdrop-filter:blur(6px);transition:.2s;white-space:nowrap;flex-shrink:0}
.cb:hover{background:rgba(255,255,255,.28)}.cb.on{background:rgba(0,180,255,.25);color:#0af;border:1px solid rgba(0,180,255,.4)}
#vw{display:flex;align-items:center;gap:4px;flex-shrink:0}
#vs{-webkit-appearance:none;appearance:none;width:52px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);outline:none;cursor:pointer}
#vs::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#0af;cursor:pointer}
#fg{flex:1}
#qw{position:relative;flex-shrink:0}
#qm{position:absolute;bottom:calc(100% + 8px);left:0;background:rgba(10,10,10,.97);border:1px solid #333;border-radius:8px;display:none;flex-direction:column;min-width:80px;max-height:45vh;overflow-y:auto;z-index:9999;box-shadow:0 -4px 20px rgba(0,0,0,.8)}
#qm.open{display:flex}#qm button{background:none;border:none;color:#fff;padding:7px 16px;cursor:pointer;font-size:12px}#qm button:hover{background:rgba(255,255,255,.08)}#qm button.active{color:#0af;font-weight:700}
#ch-bar{flex-shrink:0;background:#0a0a0a;border-top:1px solid #111;display:flex;gap:6px;padding:8px;overflow-x:auto}
#ch-bar::-webkit-scrollbar{height:3px}#ch-bar::-webkit-scrollbar-thumb{background:#222;border-radius:2px}
.ch{min-width:80px;height:46px;background:#111;border:1px solid #222;color:#ccc;font-size:11px;font-weight:700;border-radius:8px;cursor:pointer;transition:.2s;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ch:hover{background:#1a1a1a;border-color:#0af;color:#fff}.ch.on{background:rgba(0,180,255,.15);color:#0af;border-color:#0af}
#err-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#a00;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;display:none;z-index:9999}
</style>
</head>
<body>
<div id="app">
<div id="err-toast"></div>
<div id="player-wrap">
<video id="vid" playsinline webkit-playsinline></video>
<div id="brand-overlay"><span>8</span></div>
<div id="loader">جاري التحميل...</div>
<div id="ch-title"></div>
<div id="controls-overlay">
<button class="cb" onclick="togglePlay()">&#x23EF;</button>
<div id="vw"><button class="cb" id="mute-btn" onclick="toggleMute()">&#x1F50A;</button><input type="range" id="vs" min="0" max="1" step=".05" value="1" oninput="setVolume(this.value)"></div>
<button class="cb" onclick="skip(-10)">&#x23EA;</button>
<button class="cb" onclick="skip(10)">&#x23E9;</button>
<button class="cb" id="fit-btn" onclick="cycleAspect()">↕</button>
<button class="cb" onclick="doFullscreen()">&#x26F6;</button>
<div id="fg"></div>
<button class="cb" onclick="reloadCurrentStream()">&#x1F504;</button>
<div id="qw"><button class="cb" id="q-btn" onclick="toggleQ()">جودة</button><div id="qm"></div></div>
</div>
</div>
<div id="ch-bar"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
<script>
var W='https://live1.alameeeretv.workers.dev/stream/';
var CHANNELS=[
{n:'ثمانية 1',u:W+'746714.m3u8'},
{n:'ثمانية 2',u:W+'746717.m3u8'},
{n:'ثمانية 3',u:W+'746720.m3u8'}
];
var hls=null,curIdx=-1,retryT=null;
var vid=document.getElementById('vid'),loader=document.getElementById('loader'),chTitle=document.getElementById('ch-title');
var pw=document.getElementById('player-wrap'),chBar=document.getElementById('ch-bar'),qm=document.getElementById('qm'),qBtn=document.getElementById('q-btn');
var fitBtn=document.getElementById('fit-btn'),hCtrl=null;
var ASPECTS=['contain','fill'];var aIdx=0;
function cycleAspect(){aIdx=(aIdx+1)%2;vid.style.objectFit=ASPECTS[aIdx];}
function doFullscreen(){if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}var el=document.documentElement;(el.requestFullscreen?el.requestFullscreen():el.webkitRequestFullscreen?el.webkitRequestFullscreen():Promise.resolve()).then(function(){if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(function(){});}).catch(function(){});}
function showLoader(){loader.style.display='flex';}function hideLoader(){loader.style.display='none';}
function toast(msg){var t=document.getElementById('err-toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none';},4000);}
function reloadCurrentStream(){if(curIdx>=0)load(curIdx);}
function load(idx){
curIdx=idx;
if(retryT){clearTimeout(retryT);retryT=null;}
document.querySelectorAll('.ch').forEach(function(b){b.classList.remove('on');});
var btn=document.getElementById('ch-'+idx);
if(btn)btn.classList.add('on');
var ch=CHANNELS[idx];
chTitle.textContent=ch.n;chTitle.style.display='block';
showLoader();
if(hls){hls.destroy();hls=null;}
vid.removeAttribute('src');vid.load();
if(Hls.isSupported()){
hls=new Hls({enableWorker:true,startLevel:-1,autoLevelEnabled:true,maxBufferLength:10,maxMaxBufferLength:30,manifestLoadingMaxRetry:4,fragLoadingMaxRetry:4,liveSyncDurationCount:2,lowLatencyMode:true});
hls.loadSource(ch.u);
hls.attachMedia(vid);
hls.on(Hls.Events.MANIFEST_PARSED,function(){hideLoader();pw.classList.add('playing');vid.play().catch(function(){});buildQ();});
hls.on(Hls.Events.ERROR,function(e,d){if(d.fatal){if(d.type===Hls.ErrorTypes.NETWORK_ERROR){showLoader();hls.startLoad();retryT=setTimeout(function(){reloadCurrentStream();},5000);}else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){hls.recoverMediaError();}else{retryT=setTimeout(function(){reloadCurrentStream();},5000);}}});
}else if(vid.canPlayType('application/vnd.apple.mpegurl')){
vid.src=ch.u;
vid.addEventListener('loadeddata',function(){hideLoader();pw.classList.add('playing');},{once:true});
vid.play().catch(function(){});
}else{hideLoader();toast('المتصفح غير متوافق');}
}
function buildQ(){qm.innerHTML='';if(!hls)return;var lvls=hls.levels;if(!lvls||!lvls.length)return;var a=document.createElement('button');a.textContent='تلقائي';a.onclick=function(){hls.currentLevel=-1;hls.autoLevelEnabled=true;qBtn.classList.remove('on');closeQ();};qm.appendChild(a);lvls.forEach(function(lv,i){var b=document.createElement('button');b.textContent=lv.height?lv.height+'p':Math.round(lv.bitrate/1000)+'k';b.onclick=function(){hls.autoLevelEnabled=false;hls.currentLevel=i;qBtn.classList.add('on');closeQ();};qm.appendChild(b);});}
function closeQ(){qm.classList.remove('open');}
function toggleQ(){qm.classList.toggle('open');}
function togglePlay(){vid.paused?vid.play():vid.pause();}
function toggleMute(){vid.muted=!vid.muted;document.getElementById('mute-btn').textContent=vid.muted?'🔇':'🔊';}
function setVolume(v){vid.volume=parseFloat(v);vid.muted=v==0;document.getElementById('mute-btn').textContent=v==0?'🔇':'🔊';}
function skip(s){vid.currentTime+=s;}
CHANNELS.forEach(function(ch,i){var b=document.createElement('button');b.className='ch';b.textContent=ch.n;b.id='ch-'+i;b.onclick=function(){load(i);};chBar.appendChild(b);});
pw.addEventListener('click',function(e){if(e.target.closest('#controls-overlay'))return;pw.classList.add('show-ctrl');clearTimeout(hCtrl);hCtrl=setTimeout(function(){pw.classList.remove('show-ctrl');},3000);});
document.addEventListener('click',function(e){if(!e.target.closest('#qw'))closeQ();});
load(0);
</script>
</body>
</html>
