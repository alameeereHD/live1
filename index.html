<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AlameeereTv</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
#app{display:flex;flex-direction:column;width:100%;height:100%}
#player-wrap{flex:0 0 40%;min-height:200px;position:relative;user-select:none;overflow:hidden;background:#000}
video{width:100%;height:100%;display:block;background:#000}
video.fc{object-fit:contain}video.fv{object-fit:fill}video.ff{object-fit:contain;transform:scaleY(.72);transform-origin:center}
#brand-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:50;pointer-events:none;transition:opacity .5s}
#brand-overlay span{color:#fff;font-size:28px;font-weight:700;letter-spacing:2px;animation:wave 2s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(0);text-shadow:0 0 10px rgba(0,255,0,.4)}25%{transform:translateY(-8px);text-shadow:0 0 24px rgba(0,255,0,.9)}75%{transform:translateY(6px);text-shadow:0 0 18px rgba(0,255,0,.6)}}
#player-wrap.playing #brand-overlay{opacity:0;z-index:-1}
#loader{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.75);z-index:10}
#loader .wt{color:#fff;font-size:26px;font-weight:700;letter-spacing:2px;animation:wave 1.5s ease-in-out infinite}
#iframe-wrap{position:absolute;inset:0;display:none;z-index:5}
#iframe-wrap iframe{width:100%;height:100%;border:none}
#brightness-layer{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:4}
#ch-title{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);padding:5px 14px;border-radius:20px;font-size:12px;font-weight:700;color:#fff;z-index:6;display:none}
#speed-badge{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;color:#0f0;z-index:6;transition:opacity .3s;cursor:pointer;user-select:none}
#speed-badge.hide{opacity:0;pointer-events:none}
#dbl-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:15;opacity:0;transition:opacity .3s}
#dbl-hint span{background:rgba(0,0,0,.75);color:#fff;font-size:15px;padding:12px 26px;border-radius:22px;border:1px solid rgba(255,255,255,.2)}
#dbl-hint.show{opacity:1}
#swipe-ind{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:14px 22px;display:none;flex-direction:column;align-items:center;gap:8px;z-index:20;pointer-events:none;min-width:130px}
#si-icon{font-size:26px}#si-bar-bg{width:100%;height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}#si-bar{height:100%;background:#0f0;border-radius:3px}#si-label{font-size:12px;color:rgba(255,255,255,.75)}
#controls-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.92));padding:30px 8px 10px;display:flex;align-items:center;gap:4px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:100;overflow:visible}
#player-wrap.show-ctrl #controls-overlay{opacity:1;pointer-events:auto}
.cb{background:rgba(255,255,255,.12);border:none;color:#fff;padding:5px 8px;border-radius:5px;cursor:pointer;font-size:11px;backdrop-filter:blur(6px);transition:.2s;white-space:nowrap;flex-shrink:0}
.cb:hover{background:rgba(255,255,255,.28)}.cb.on{background:rgba(0,200,0,.2);color:#0f0;border:1px solid rgba(0,255,0,.3)}
#vw{display:flex;align-items:center;gap:4px;flex-shrink:0}
#vs{-webkit-appearance:none;appearance:none;width:48px;height:4px;border-radius:2px;background:rgba(255,255,255,.3);outline:none;cursor:pointer}
#vs::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#0f0;cursor:pointer}
#fg{flex:1;min-width:2px}
#qw{position:relative;flex-shrink:0;margin-left:6px}
#qm{position:absolute;bottom:calc(100% + 8px);left:0;background:rgba(10,10,10,.97);border:1px solid #333;border-radius:8px;display:none;flex-direction:column;min-width:80px;max-height:50vh;overflow-y:auto;z-index:9999;box-shadow:0 -4px 20px rgba(0,0,0,.8)}
#qm.open{display:flex}#qm button{background:none;border:none;color:#fff;padding:6px 14px;cursor:pointer;text-align:center;font-size:12px}#qm button:hover{background:rgba(255,255,255,.08)}#qm button.active{color:#0f0;font-weight:700}#q-btn.manual{background:rgba(0,200,0,.2);color:#0f0;border:1px solid rgba(0,255,0,.35)}
#ch-rows{flex:1 1 0;min-height:0;background:#030303;border-top:1px solid #111;display:flex;flex-direction:column;overflow-y:auto;padding:2px 0}
.ch-row{flex-shrink:0;display:flex;align-items:center;border-bottom:1px solid #0a0a0a;padding:2px 0}
.row-label{flex-shrink:0;width:50px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#050505;border-left:1px solid #111}
.row-label .ico{font-size:14px}.row-label .lbl{font-size:8px;color:#666;font-weight:700}
.row-scroll{flex:1;display:flex;gap:4px;padding:4px;overflow-x:auto;align-items:center}
.row-scroll::-webkit-scrollbar{height:3px}.row-scroll::-webkit-scrollbar-thumb{background:#222;border-radius:2px}
.ch{min-width:65px;height:40px;background:#0a0a0a;border:1px solid #1a1a1a;color:#bbb;font-size:10px;font-weight:700;border-radius:6px;cursor:pointer;transition:.2s;flex-shrink:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px}
.ch:hover{background:#151515;border-color:#0f0;color:#fff}.ch.on{background:#0f0;color:#000;border-color:#0f0}
.ch.iframe-ch{border-color:#f80}.ch.iframe-ch.on{background:#f80;color:#000}
.ch.ts-ch{border-color:#f0f}.ch.ts-ch.on{background:#f0f;color:#000}
#err-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#a00;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;display:none;z-index:9999}
</style>
</head>
<body>
<div id="app">
<div id="err-toast"></div>
<div id="player-wrap">
<video id="vid" class="fc" playsinline webkit-playsinline></video>
<div id="brand-overlay"><span>AlameeereTv</span></div>
<div id="iframe-wrap"><iframe id="iframe-player" allowfullscreen allow="autoplay;encrypted-media"></iframe></div>
<div id="brightness-layer"></div>
<div id="loader"><div class="wt">AlameeereTv</div></div>
<div id="ch-title"></div>
<div id="speed-badge" onclick="runSpeedTest()">&#x1F4E1; السرعة</div>
<div id="dbl-hint"><span id="dbl-txt">&#x26F6;</span></div>
<div id="controls-overlay">
<button class="cb" onclick="togglePlay()">&#x23EF;</button>
<div id="vw"><button class="cb" id="mute-btn" onclick="toggleMute()">&#x1F50A;</button><input type="range" id="vs" min="0" max="1" step=".05" value="1" oninput="setVolume(this.value)"></div>
<button class="cb" onclick="skip(-10)">&#x23EA;</button>
<button class="cb" onclick="skip(10)">&#x23E9;</button>
<button class="cb" id="fit-btn" onclick="cycleAspect()">&#x2195; عادي</button>
<button class="cb" id="spd-btn" onclick="toggleSpeed()">&#x1F4E1;</button>
<button class="cb" onclick="doFullscreen()">&#x26F6;</button>
<div id="fg"></div>
<button class="cb" onclick="reloadCurrentStream()">&#x1F504;</button>
<div id="qw"><button class="cb" id="q-btn" onclick="toggleQ()">جودة</button><div id="qm"></div></div>
</div>
</div>
<div id="ch-rows">
<div class="ch-row"><div class="row-label"><span class="ico">&#x1F4FA;</span><span class="lbl">أخبار</span></div><div class="row-scroll" id="row-0"></div></div>
<div class="ch-row"><div class="row-label"><span class="ico">&#x1F4FA;</span><span class="lbl">MBC</span></div><div class="row-scroll" id="row-1"></div></div>
<div class="ch-row"><div class="row-label"><span class="ico">&#x26BD;</span><span class="lbl">رياضة</span></div><div class="row-scroll" id="row-2"></div></div>
<div class="ch-row"><div class="row-label"><span class="ico">8</span><span class="lbl">ثمانية</span></div><div class="row-scroll" id="row-3"></div></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
<script>
var ROWS=[
{channels:[{n:'الجزيرة',u:'https://live-hls-web-aja-gcp.thehlive.com/AJA/index.m3u8',t:'hls'},{n:'العربية',u:'https://live.alarabiya.net/alarabiapublish/alarabiya.smil/playlist.m3u8',t:'hls'},{n:'الحدث',u:'https://live.alarabiya.net/alarabiapublish/alhadath.smil/playlist.m3u8',t:'hls'},{n:'سكاي نيوز',u:'https://stream.skynewsarabia.com/hls/sna.m3u8',t:'hls'}]},
{channels:[{n:'MBC 1',u:'https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-1/15cf99af5de54063fdabfefe66adc075/index.m3u8',t:'hls'},{n:'MBC 2',u:'https://auratvdz.lovable.app/api/public/stream?url=http%3A%2F%2Fcloth.orangecord.net%2Fpdf%2Fsat2MBC2%2Findex.m3u8%3Ftoken%3D%3D',t:'hls'},{n:'MBC 3',u:'https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-3-usa/5d58265a862a476dc7f97694addb5ded/index.m3u8',t:'hls'},{n:'MBC 4',u:'https://shd-gcp-live.edgenextcdn.net/live/bitmovin-mbc-4/24f134f1cd63db9346439e96b86ca6ed/index.m3u8',t:'hls'}]},
{channels:[{n:'الكأس 1',u:'https://liveeu-gcp.alkassdigital.net/alkass1-p/main.m3u8',t:'hls'},{n:'الكأس 2',u:'https://liveeu-gcp.alkassdigital.net/alkass2-p/main.m3u8',t:'hls'},{n:'الكأس 3',u:'https://liveeu-gcp.alkassdigital.net/alkass3-p/main.m3u8',t:'hls'},{n:'الكأس 4',u:'https://liveeu-gcp.alkassdigital.net/alkass4-p/main.m3u8',t:'hls'}]},
{channels:[{n:'ثمانية 1',u:'https://ahm79.store/live/0545580310/7337741654/746714.m3u8',t:'hls'},{n:'ثمانية 2',u:'https://ahm79.store/live/0545580310/7337741654/746717.m3u8',t:'hls'},{n:'ثمانية 3',u:'https://ahm79.store/live/0545580310/7337741654/746720.m3u8',t:'hls'}]}
];
var hls=null,cur={r:-1,i:-1},retryT=null;
var vid=document.getElementById('vid'),ifw=document.getElementById('iframe-wrap'),ifp=document.getElementById('iframe-player');
var qm=document.getElementById('qm'),qBtn=document.getElementById('q-btn'),loader=document.getElementById('loader');
var chTitle=document.getElementById('ch-title'),brightL=document.getElementById('brightness-layer'),pw=document.getElementById('player-wrap'),chRows=document.getElementById('ch-rows');
var fitBtn=document.getElementById('fit-btn'),speedBadge=document.getElementById('speed-badge'),spdBtn=document.getElementById('spd-btn');
var ASPECTS=[{cls:'fc',lbl:'↕ عادي'},{cls:'fv',lbl:'⛶ ملء'},{cls:'ff',lbl:'↔ مفيد'}];
var aIdx=parseInt(localStorage.getItem('aIdx')||'0');
function applyAspect(i){vid.className=ASPECTS[i].cls;fitBtn.textContent=ASPECTS[i].lbl;localStorage.setItem('aIdx',i);}
function cycleAspect(){aIdx=(aIdx+1)%3;applyAspect(aIdx);}applyAspect(aIdx);
function doFullscreen(){if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}var el=document.documentElement;Promise.resolve(el.requestFullscreen?el.requestFullscreen():el.webkitRequestFullscreen?el.webkitRequestFullscreen():null).then(function(){if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(function(){});chRows.style.display='none';}).catch(function(){chRows.style.display='none';});}
document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement&&!document.webkitFullscreenElement){chRows.style.display='flex';}});
var speedOn=true,isTesting=false,spInt=null;
function runSpeedTest(){if(isTesting)return;isTesting=true;speedBadge.textContent='📡 ...';var t0=Date.now();fetch('https://httpbin.org/bytes/200000?r='+Date.now(),{cache:'no-store'}).then(function(r){return r.blob();}).then(function(b){var spd=((b.size||200000)*8)/((Date.now()-t0)/1000);speedBadge.textContent=spd>=1e6?'📡 '+(spd/1e6).toFixed(1)+' Mbps':'📡 '+Math.round(spd/1000)+' Kbps';speedBadge.style.color=spd>=1e7?'#0f0':spd>=2e6?'#ff0':spd>=5e5?'#f80':'#f44';isTesting=false;}).catch(function(){isTesting=false;});}
function toggleSpeed(){speedOn=!speedOn;spdBtn.classList.toggle('on',speedOn);speedBadge.classList.toggle('hide',!speedOn);if(speedOn){runSpeedTest();spInt=setInterval(runSpeedTest,15000);}else if(spInt){clearInterval(spInt);spInt=null;}}runSpeedTest();spInt=setInterval(runSpeedTest,15000);
function showLoader(){loader.style.display='flex';}function hideLoader(){loader.style.display='none';}
function toast(msg){var t=document.getElementById('err-toast');t.textContent=msg;t.style.display='block';setTimeout(function(){t.style.display='none';},4000);}
function reloadCurrentStream(){if(cur.r>=0)load(cur.r,cur.i);}
function startHls(url){vid.style.display='block';ifw.style.display='none';ifp.src='';showLoader();if(hls){hls.destroy();hls=null;}vid.removeAttribute('src');vid.load();if(Hls.isSupported()){hls=new Hls({enableWorker:true,startLevel:-1,autoLevelEnabled:true,maxBufferLength:10,maxMaxBufferLength:30,manifestLoadingMaxRetry:4,fragLoadingMaxRetry:4,liveSyncDurationCount:2,lowLatencyMode:true});hls.loadSource(url);hls.attachMedia(vid);hls.on(Hls.Events.MANIFEST_PARSED,function(){hideLoader();pw.classList.add('playing');vid.play().catch(function(){});buildQ();});hls.on(Hls.Events.ERROR,function(e,d){if(d.fatal){if(d.type===Hls.ErrorTypes.NETWORK_ERROR){showLoader();hls.startLoad();retryT=setTimeout(function(){reloadCurrentStream();},5000);}else if(d.type===Hls.ErrorTypes.MEDIA_ERROR){hls.recoverMediaError();}else{retryT=setTimeout(function(){reloadCurrentStream();},5000);}}});}else if(vid.canPlayType('application/vnd.apple.mpegurl')){vid.src=url;vid.addEventListener('loadeddata',function(){hideLoader();pw.classList.add('playing');},{once:true});vid.play().catch(function(){});}else{hideLoader();toast('المتصفح غير متوافق');}}
function buildChannels(){ROWS.forEach(function(row,ri){var box=document.getElementById('row-'+ri);if(!box)return;row.channels.forEach(function(c,ci){var b=document.createElement('button');b.className='ch'+(c.t==='iframe'?' iframe-ch':c.t==='ts'?' ts-ch':'');b.textContent=c.n;b.id='ch-'+ri+'-'+ci;b.onclick=function(){load(ri,ci);};box.appendChild(b);});});}
function load(ri,ci){if(ri<0||ri>=ROWS.length||ci<0||ci>=ROWS[ri].channels.length)return;cur={r:ri,i:ci};if(retryT){clearTimeout(retryT);retryT=null;}document.querySelectorAll('.ch').forEach(function(b){b.classList.remove('on');});var btn=document.getElementById('ch-'+ri+'-'+ci);if(btn)btn.classList.add('on');var ch=ROWS[ri].channels[ci];chTitle.textContent=ch.n;chTitle.style.display='block';startHls(ch.u);}
function buildQ(){qm.innerHTML='';if(!hls)return;var lvls=hls.levels;if(!lvls||!lvls.length)return;var a=document.createElement('button');a.textContent='تلقائي';a.onclick=function(){hls.currentLevel=-1;hls.autoLevelEnabled=true;qBtn.classList.remove('manual');updateQActive();closeQ();};qm.appendChild(a);lvls.forEach(function(lv,i){var b=document.createElement('button');b.textContent=lv.height?lv.height+'p':Math.round(lv.bitrate/1000)+'k';b.onclick=function(){hls.autoLevelEnabled=false;hls.currentLevel=i;qBtn.classList.add('manual');updateQActive();closeQ();};qm.appendChild(b);});updateQActive();}
function updateQActive(){if(!hls)return;qm.querySelectorAll('button').forEach(function(b,i){if(i===0)b.classList.toggle('active',hls.currentLevel===-1);else b.classList.toggle('active',hls.currentLevel===(i-1));});}
function closeQ(){qm.classList.remove('open');}
function toggleQ(){qm.classList.toggle('open');if(qm.classList.contains('open'))updateQActive();}
function togglePlay(){vid.paused?vid.play():vid.pause();}
function toggleMute(){vid.muted=!vid.muted;document.getElementById('mute-btn').textContent=vid.muted?'🔇':'🔊';document.getElementById('vs').value=vid.muted?0:vid.volume;}
function setVolume(v){vid.volume=parseFloat(v);vid.muted=v==0;document.getElementById('mute-btn').textContent=v==0?'🔇':'🔊';document.getElementById('vs').value=v;}
function skip(s){vid.currentTime+=s;}
document.addEventListener('click',function(e){if(!e.target.closest('#qw'))closeQ();});
buildChannels();load(3,0);
</script>
</body>
</html>
